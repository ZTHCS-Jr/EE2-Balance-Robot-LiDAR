# explore_lite (m-explore-ros2) config. It reads nav2's GLOBAL costmap to find
# frontiers (free cells next to unknown) and sends NavigateToPose goals to nav2.
explore_node:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: base_link
    costmap_topic: global_costmap/costmap
    costmap_updates_topic: global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.1         # re-pick a frontier only every ~10 s, so the slow
                                   # robot commits to a goal and actually reaches it
                                   # (was 0.33 -> preempted every ~3 s before moving)
    progress_timeout: 45.0         # generous: at ~0.12 m/s a small room takes a while,
                                   # don't abandon a goal prematurely
    potential_scale: 3.0           # weight distance-to-frontier
    orientation_scale: 0.0         # ignore orientation
    gain_scale: 1.0                # weight frontier size
    transform_tolerance: 0.5
    min_frontier_size: 0.15        # was 0.3; smaller -> keeps finding frontiers so it
                                   # explores longer instead of quitting after one goal
    return_to_init: false
